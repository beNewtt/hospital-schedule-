/* ---------- Firestore-backed storage shim ----------
   Same get/set/delete/list signature as before, but now reads/writes
   Firestore under users/{uid}/data/{key} so data syncs across devices.
   Requires signing in first (see AuthGate below). */
window.storage = {
  async get(key, shared) {
    if (!currentUid) throw new Error('not signed in');
    const ref = shared
      ? db.collection('shared').doc(key)
      : db.collection('users').doc(currentUid).collection('data').doc(key);
    const snap = await ref.get();
    if (!snap.exists) throw new Error('key not found');
    return { key, value: snap.data().value, shared: !!shared };
  },
  async set(key, value, shared) {
    if (!currentUid) throw new Error('not signed in');
    const ref = shared
      ? db.collection('shared').doc(key)
      : db.collection('users').doc(currentUid).collection('data').doc(key);
    await ref.set({ value, updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
    return { key, value, shared: !!shared };
  },
  async delete(key, shared) {
    if (!currentUid) throw new Error('not signed in');
    const ref = shared
      ? db.collection('shared').doc(key)
      : db.collection('users').doc(currentUid).collection('data').doc(key);
    await ref.delete();
    return { key, deleted: true, shared: !!shared };
  },
  async list(prefix, shared) {
    if (!currentUid) throw new Error('not signed in');
    const col = shared ? db.collection('shared') : db.collection('users').doc(currentUid).collection('data');
    const snap = await col.get();
    const keys = snap.docs.map(d => d.id).filter(k => !prefix || k.startsWith(prefix));
    return { keys, prefix: prefix || '', shared: !!shared };
  },
};

const SKIP_WORDS = new Set(['ฟุ้ง', 'off', 'Screen', 'ปกส', 'รพ.สต.', '1/1', 'DM', 'เตียงเสริม']);
const TIME_RE = /^(\d{1,2}:\d{2})\s*(.*)$/;

function pad(n) { return n < 10 ? '0' + n : '' + n; }
function dateKey(y, m, d) { return `${y}-${pad(m)}-${pad(d)}`; }
function daysInMonth(y, m) { return new Date(y, m, 0).getDate(); }
function firstWeekday(y, m) { return new Date(y, m - 1, 1).getDay(); }
function timeToMin(t) { if (!t) return 0; const [h, m] = t.split(':').map(Number); return h * 60 + m; }
function minToTime(mins) { const h = Math.floor(mins / 60) % 24; const m = mins % 60; return `${pad(h)}:${pad(m)}`; }
function uid() { return Math.random().toString(36).slice(2, 10); }

function parseHnCategory(text) {
  let rest = (text || '').trim();
  let hn = '';
  const hnMatch = rest.match(/^(\d{4,7})\s+/);
  if (hnMatch) { hn = hnMatch[1]; rest = rest.slice(hnMatch[0].length).trim(); }
  let category = 'อื่นๆ';
  for (const [kw, cat] of CATEGORY_KEYWORDS) {
    const re = new RegExp('(^|[^a-zA-Zก-๙])' + kw.replace('/', '\\/') + '([^a-zA-Zก-๙]|$)', 'i');
    if (re.test(rest)) { category = cat; break; }
  }
  return { hn, name: rest || text.trim(), category };
}

function parseLegacyToCases(apps) {
  const out = [];
  if (!apps) return out;
  for (const line of apps) {
    const m = line.match(TIME_RE);
    if (!m) continue;
    const time = m[1];
    const rest = m[2].trim();
    if (!rest || SKIP_WORDS.has(rest)) continue;
    const { hn, name, category } = parseHnCategory(rest);
    out.push({ time, hn, name, category });
  }
  return out;
}

        try {
          const oldRes = await window.storage.get('patient-entries', false);
          if (oldRes?.value) oldPatients = JSON.parse(oldRes.value);
        } catch (e) {}

        if (oldPatients) {
          Object.keys(oldPatients).forEach(dstr => {
            (oldPatients[dstr] || []).forEach(entry => {
              const { hn, name, category } = parseHnCategory(entry.name);
              const id = uid();
              migrated[id] = {
                id, hn, name, phone: '', category,
                visits: [{ id: uid(), date: dstr, time: entry.time, duration: entry.duration || 30, step: entry.note || '' }],
              };
            });
          });
        } else {
          Object.keys(SCHEDULE_DATA).forEach(dstr => {
            const parsed = parseLegacyToCases(SCHEDULE_DATA[dstr].appointments);
            parsed.forEach(p => {
              const id = uid();
              migrated[id] = {
                id, hn: p.hn, name: p.name, phone: '', category: p.category,
                visits: [{ id: uid(), date: dstr, time: p.time, duration: 30, step: '' }],
              };
            });
          });
        }
        setCases(migrated);
        try { await window.storage.set('cases', JSON.stringify(migrated), false); } catch (e) {}
      }
      setLoaded(true);
    })();
  }, []);

  const saveCases = async (next) => {
    setCases(next);
    try { await window.storage.set('cases', JSON.stringify(next), false); } catch (e) { console.error(e); }
  };
  const saveLegend = async (next) => {
    setShiftNotes(next);
    try { await window.storage.set('legend-notes', JSON.stringify({ shift: next }), false); } catch (e) {}
  };
  const saveOverrides = async (next) => {
    setShiftOverrides(next);
    try { await window.storage.set('shift-overrides', JSON.stringify(next), false); } catch (e) {}
  };

  const getShift = (dstr) => shiftOverrides[dstr] !== undefined ? shiftOverrides[dstr] : (SCHEDULE_DATA[dstr]?.shift || null);
  const setShift = (dstr, code) => saveOverrides({ ...shiftOverrides, [dstr]: code || null });

  const buildCells = (y, m) => {
    const fw = firstWeekday(y, m);
    const nd = daysInMonth(y, m);
    const arr = [];
    for (let i = 0; i < fw; i++) arr.push(null);
    for (let d = 1; d <= nd; d++) {
      const dstr = dateKey(y, m, d);
      arr.push({ day: d, dstr, info: SCHEDULE_DATA[dstr] || null, shift: getShift(dstr) });
    }
    return arr;
  };

  const visitsForDate = (dstr) => {
    const out = [];
    Object.values(cases).forEach(c => {
      (c.visits || []).forEach(v => { if (v.date === dstr) out.push({ case: c, visit: v }); });
    });
    return out.sort((a, b) => timeToMin(a.visit.time) - timeToMin(b.visit.time));
  };
  const countForDate = (dstr) => Object.values(cases).reduce((n, c) => n + (c.visits || []).filter(v => v.date === dstr && v.status !== 'cancelled').length, 0);

  const cells = useMemo(() => buildCells(year, month), [year, month, shiftOverrides]);
  const selInfo = selected ? SCHEDULE_DATA[selected] : null;
  const selShift = selected ? getShift(selected) : null;
  const dayVisits = selected ? visitsForDate(selected) : [];
  const leftoverNotes = (selInfo?.appointments || []).filter(line => {
    const m = line.match(TIME_RE);
    return !m || SKIP_WORDS.has((m[2] || '').trim());
  });

  const todayStr = '2026-07-01';

  const searchResults = useMemo(() => {
    if (!searchQuery.trim()) return [];
    const q = searchQuery.trim().toLowerCase();
    return Object.values(cases).filter(c => c.hn.includes(q) || c.name.toLowerCase().includes(q)).slice(0, 8);
  }, [searchQuery, cases]);

  const patientListResults = useMemo(() => {
    const q = patientListQuery.trim().toLowerCase();
    let list = Object.values(cases);
    if (q) list = list.filter(c => c.hn.includes(q) || c.name.toLowerCase().includes(q) || c.category.toLowerCase().includes(q));
    return list.map(c => {
      const active = c.visits.filter(v => v.status !== 'cancelled');
      const cancelledCount = c.visits.length - active.length;
      const future = active.filter(v => v.date >= todayStr).sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
      const past = active.filter(v => v.date < todayStr).sort((a, b) => (b.date + b.time).localeCompare(a.date + a.time));
      const nextVisit = future[0] || null;
      const lastVisit = past[0] || null;
      return { ...c, activeCount: active.length, cancelledCount, nextVisit, lastVisit };
    }).sort((a, b) => a.name.localeCompare(b.name, 'th'));
  }, [patientListQuery, cases]);

  const resetNewForm = () => { setFHn(''); setFName(''); setFPhone(''); setFCategory('ตรวจ'); setFTime('13:00'); setFDuration(30); setFStep(''); };

  const createCase = () => {
    if (!selected || !fName.trim()) return;
    const id = uid();
    const next = {
      ...cases,
      [id]: {
        id, hn: fHn.trim(), name: fName.trim(), phone: fPhone.trim(), category: fCategory,
        visits: [{ id: uid(), date: selected, time: fTime, duration: fDuration, step: fStep.trim() }],
      },
    };
    saveCases(next);
    resetNewForm();
  };

  const addVisitToCase = () => {
    if (!selected || !pickedCaseId || !cases[pickedCaseId]) return;
    const c = cases[pickedCaseId];
    const nextCase = { ...c, visits: [...c.visits, { id: uid(), date: selected, time: fTime, duration: fDuration, step: fStep.trim() }] };
    saveCases({ ...cases, [pickedCaseId]: nextCase });
    setPickedCaseId(null); setSearchQuery(''); resetNewForm();
  };

  const removeVisit = (caseId, visitId) => {
    const c = cases[caseId]; if (!c) return;
    const nextVisits = c.visits.filter(v => v.id !== visitId);
    const next = { ...cases };
    if (nextVisits.length === 0) delete next[caseId]; else next[caseId] = { ...c, visits: nextVisits };
    saveCases(next);
    if (nextVisits.length === 0 && historyCaseId === caseId) setHistoryCaseId(null);
  };

  const toggleCancelVisit = (caseId, visitId) => {
    const c = cases[caseId]; if (!c) return;
    const nextVisits = c.visits.map(v => v.id === visitId ? { ...v, status: v.status === 'cancelled' ? undefined : 'cancelled' } : v);
    saveCases({ ...cases, [caseId]: { ...c, visits: nextVisits } });
  };

  const deleteCase = (caseId) => {
    const next = { ...cases }; delete next[caseId]; saveCases(next);
    if (historyCaseId === caseId) setHistoryCaseId(null);
  };

  const goMonth = (delta) => {
    let m = month + delta, y = year;
    if (m < 1) { m = 12; y -= 1; } else if (m > 12) { m = 1; y += 1; }
    setMonth(m); setYear(y); setSelected(null);
  };
  const openDay = (dstr, y, m) => { setYear(y); setMonth(m); setSelected(dstr); setView('calendar'); };
  const jumpToVisit = (dstr) => { const [y, m] = dstr.split('-').map(Number); setYear(y); setMonth(m); setSelected(dstr); setView('calendar'); setHistoryCaseId(null); };

  const historyCase = historyCaseId ? cases[historyCaseId] : null;
  const historyVisitsSorted = historyCase ? [...historyCase.visits].sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time)) : [];

  const VisitRow = ({ c, v, showJump }) => {
    const cs = CATEGORY_STYLE[c.category] || CATEGORY_STYLE['อื่นๆ'];
    const cancelled = v.status === 'cancelled';
    return (
      <div style={{ padding: '8px 10px', borderRadius: 8, background: cancelled ? '#F3EDE9' : '#FAF6EF', marginBottom: 6, opacity: cancelled ? 0.7 : 1 }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
          <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 12.5, fontWeight: 600, color: cancelled ? '#B9AF9A' : '#1F5B54', minWidth: 92, textDecoration: cancelled ? 'line-through' : 'none' }}>
            {v.time}–{minToTime(timeToMin(v.time) + v.duration)}
          </div>
          <div style={{ flex: 1 }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 6, flexWrap: 'wrap' }}>
              {c.hn && <span style={{ fontSize: 11, fontFamily: "'IBM Plex Mono', monospace", color: '#8A7F63' }}>HN {c.hn}</span>}
              <span style={{ fontSize: 13.5, fontWeight: 600, color: cancelled ? '#B9AF9A' : '#1F3A35', textDecoration: cancelled ? 'line-through' : 'none' }}>{c.name}</span>
              <span style={{ fontSize: 10.5, fontWeight: 700, padding: '1px 7px', borderRadius: 10, background: cs.bg, color: cs.text }}>{c.category}</span>
              {cancelled && <span style={{ fontSize: 10, fontWeight: 700, color: '#A33636' }}>ยกเลิกแล้ว</span>}
            </div>
            {v.step && <div style={{ fontSize: 12, color: '#5C6D68', marginTop: 2 }}>{v.step}</div>}
            {showJump && <button onClick={() => jumpToVisit(v.date)} style={{ fontSize: 11, color: '#1F5B54', background: 'none', border: 'none', cursor: 'pointer', textDecoration: 'underline', padding: 0, marginTop: 2 }}>{v.date} — ไปที่วันนัด</button>}
          </div>
          <button onClick={() => toggleCancelVisit(c.id, v.id)} title={cancelled ? 'เอากลับมา' : 'ยกเลิกนัด'} style={{ border: 'none', background: 'none', cursor: 'pointer', padding: 2 }}>
            {cancelled ? <Icon name="rotateCcw" size={14} color="#5C6D68" /> : <Icon name="ban" size={14} color="#A33636" />}
          </button>
          <button onClick={() => setHistoryCaseId(historyCaseId === c.id ? null : c.id)} title="ดูประวัติเคส" style={{ border: 'none', background: 'none', cursor: 'pointer', padding: 2 }}><Icon name="history" size={15} color="#1F5B54" /></button>
          <button onClick={() => removeVisit(c.id, v.id)} title="ลบนัดนี้" style={{ border: 'none', background: 'none', cursor: 'pointer', padding: 2 }}><Icon name="x" size={14} color="#B9AF9A" /></button>
        </div>
      </div>
    );
  };

  return (
    <div style={{ fontFamily: "'Sarabun', sans-serif", background: '#FAF6EF', minHeight: '100vh', color: '#1F3A35', padding: '20px 14px 60px' }}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@500;600;700&family=Sarabun:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap');
        * { box-sizing: border-box; }
        .cell:hover { transform: translateY(-2px); box-shadow: 0 4px 10px rgba(31,58,53,0.12); }
        .cell { transition: all 0.15s ease; cursor: pointer; }
        .ov-cell:hover { outline: 1.5px solid #1F5B54; }
        .tab-btn { transition: all 0.15s ease; }
        .stepbtn { transition: background 0.15s ease; }
        .stepbtn:hover { background: #1F5B54 !important; color: #FAF6EF !important; }
        .search-item:hover { background: #F0EBDD !important; }
        .plist-row:hover { background: #F3F0E6 !important; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: #DCD4C4; border-radius: 4px; }
      `}</style>

      <div style={{ maxWidth: 760, margin: '0 auto' }}>
        <header style={{ marginBottom: 16 }}>
          <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, letterSpacing: 2, color: '#8A7F63', textTransform: 'uppercase', marginBottom: 4 }}>
            งานโรงพยาบาล &amp; นัดคนไข้
          </div>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: 8 }}>
            <h1 style={{ fontFamily: "'Kanit', sans-serif", fontSize: 24, fontWeight: 700, margin: 0, color: '#1F5B54' }}>
              {view === 'calendar' ? `${THAI_MONTH_NAMES[month - 1]} ${year}` : view === 'overview' ? `ภาพรวมทั้งปี ${year}` : 'รายชื่อคนไข้ทั้งหมด'}
            </h1>
            <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap' }}>
              <button onClick={() => setView('calendar')} className="tab-btn" style={{ fontFamily: "'Kanit', sans-serif", fontWeight: 600, fontSize: 13, padding: '6px 12px', borderRadius: 7, border: 'none', cursor: 'pointer', background: view === 'calendar' ? '#1F5B54' : '#F0EBDD', color: view === 'calendar' ? '#FAF6EF' : '#5C6D68' }}>ปฏิทิน</button>
              <button onClick={() => setView('overview')} className="tab-btn" style={{ fontFamily: "'Kanit', sans-serif", fontWeight: 600, fontSize: 13, padding: '6px 12px', borderRadius: 7, border: 'none', cursor: 'pointer', background: view === 'overview' ? '#1F5B54' : '#F0EBDD', color: view === 'overview' ? '#FAF6EF' : '#5C6D68' }}>ภาพรวม</button>
              <button onClick={() => setView('patients')} className="tab-btn" style={{ fontFamily: "'Kanit', sans-serif", fontWeight: 600, fontSize: 13, padding: '6px 12px', borderRadius: 7, border: 'none', cursor: 'pointer', background: view === 'patients' ? '#1F5B54' : '#F0EBDD', color: view === 'patients' ? '#FAF6EF' : '#5C6D68', display: 'flex', alignItems: 'center', gap: 5 }}><Icon name="users" size={13} /> รายชื่อคนไข้</button>
            </div>
          </div>
        </header>

        {view !== 'patients' && (
          <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 16, borderBottom: '2px solid #DCD4C4', paddingBottom: 10 }}>
            <button onClick={() => setYear(year - 1)} style={{ border: 'none', background: 'none', cursor: 'pointer', padding: 4 }}><Icon name="chevronLeft" size={16} color="#8A7F63" /></button>
            <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 13, fontWeight: 600, color: '#5C6D68' }}>ปี {year}</span>
            <button onClick={() => setYear(year + 1)} style={{ border: 'none', background: 'none', cursor: 'pointer', padding: 4 }}><Icon name="chevronRight" size={16} color="#8A7F63" /></button>
            {view === 'calendar' && (
              <div style={{ marginLeft: 'auto', display: 'flex', alignItems: 'center', gap: 4 }}>
                <button onClick={() => goMonth(-1)} style={{ border: 'none', background: 'none', cursor: 'pointer', padding: 4 }}><Icon name="chevronLeft" size={20} color="#1F5B54" /></button>
                <span style={{ fontFamily: "'Kanit', sans-serif", fontSize: 14, fontWeight: 600, color: '#1F5B54', minWidth: 90, textAlign: 'center' }}>{THAI_MONTH_NAMES[month - 1]}</span>
                <button onClick={() => goMonth(1)} style={{ border: 'none', background: 'none', cursor: 'pointer', padding: 4 }}><Icon name="chevronRight" size={20} color="#1F5B54" /></button>
              </div>
            )}
          </div>
        )}

        {/* Global case history panel */}
        {historyCase && (
          <div style={{ background: '#F3F0E6', border: '1px solid #DCD4C4', borderRadius: 10, padding: 14, marginBottom: 18 }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 8 }}>
              <div style={{ fontSize: 14, fontWeight: 700, color: '#1F5B54' }}>
                ประวัติเคส: {historyCase.hn ? `HN ${historyCase.hn} · ` : ''}{historyCase.name} <span style={{ fontWeight: 500, color: '#8A7F63' }}>({historyCase.category})</span>
                {historyCase.phone && <span style={{ fontWeight: 500, color: '#8A7F63' }}> · โทร {historyCase.phone}</span>}
              </div>
              <button onClick={() => setHistoryCaseId(null)} style={{ border: 'none', background: 'none', cursor: 'pointer' }}><Icon name="x" size={16} color="#8A7F63" /></button>
            </div>
            {historyVisitsSorted.map((v, idx) => {
              const cancelled = v.status === 'cancelled';
              return (
                <div key={v.id} style={{ display: 'flex', alignItems: 'center', gap: 8, fontSize: 12.5, padding: '6px 0', borderBottom: idx < historyVisitsSorted.length - 1 ? '1px solid #E4DECB' : 'none' }}>
                  <span style={{ fontWeight: 700, color: cancelled ? '#B9AF9A' : '#1F5B54', minWidth: 62 }}>ครั้งที่ {idx + 1}</span>
                  <span style={{ fontFamily: "'IBM Plex Mono', monospace", color: '#5C6D68', minWidth: 130, textDecoration: cancelled ? 'line-through' : 'none' }}>{v.date} {v.time}</span>
                  <span style={{ flex: 1, color: cancelled ? '#B9AF9A' : '#1F3A35', textDecoration: cancelled ? 'line-through' : 'none' }}>{v.step || '—'}</span>
                  {cancelled && <span style={{ fontSize: 10, fontWeight: 700, color: '#A33636' }}>ยกเลิกแล้ว</span>}
                  <button onClick={() => jumpToVisit(v.date)} style={{ fontSize: 11, color: '#1F5B54', background: 'none', border: 'none', cursor: 'pointer', textDecoration: 'underline' }}>ไปดู</button>
                  <button onClick={() => toggleCancelVisit(historyCase.id, v.id)} style={{ border: 'none', background: 'none', cursor: 'pointer' }}>{cancelled ? <Icon name="rotateCcw" size={13} color="#5C6D68" /> : <Icon name="ban" size={13} color="#A33636" />}</button>
                  <button onClick={() => removeVisit(historyCase.id, v.id)} style={{ border: 'none', background: 'none', cursor: 'pointer' }}><Icon name="x" size={12} color="#B9AF9A" /></button>
                </div>
              );
            })}
            <button onClick={() => deleteCase(historyCase.id)} style={{ marginTop: 8, fontSize: 11, color: '#A33636', background: 'none', border: 'none', cursor: 'pointer', textDecoration: 'underline' }}>ลบเคสนี้ทั้งหมด</button>
          </div>
        )}

        {view === 'calendar' && (
          <>
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(7,1fr)', gap: 6, marginBottom: 6 }}>
              {WEEKDAYS_TH.map(w => <div key={w} style={{ textAlign: 'center', fontSize: 11, fontWeight: 600, color: '#8A7F63', fontFamily: "'IBM Plex Mono', monospace" }}>{w}</div>)}
            </div>
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(7,1fr)', gap: 6, marginBottom: 22 }}>
              {cells.map((c, i) => {
                if (!c) return <div key={'e' + i} />;
                const s = c.shift ? SHIFT_STYLE[c.shift] : null;
                const isToday = c.dstr === todayStr;
                const isSel = c.dstr === selected;
                const vc = countForDate(c.dstr);
                return (
                  <div key={c.dstr} className="cell" onClick={() => setSelected(c.dstr)}
                    style={{ minHeight: 62, borderRadius: 8, background: s ? s.soft : '#FFFFFF', border: isSel ? '2px solid #1F5B54' : isToday ? '2px solid #D9694F' : '1px solid #EAE3D3', borderLeft: s ? `4px solid ${s.bar}` : (isSel ? '2px solid #1F5B54' : '1px solid #EAE3D3'), padding: '6px 6px 4px', position: 'relative', overflow: 'hidden' }}>
                    <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 13, fontWeight: 600 }}>{c.day}</div>
                    {c.info?.holiday && <div style={{ fontSize: 9, color: '#9C4530', fontWeight: 600, lineHeight: 1.2, marginTop: 1 }}>{c.info.holiday}</div>}
                    {s && <div style={{ fontSize: 9.5, color: s.text, fontWeight: 600, marginTop: 2 }}>{s.label}</div>}
                    {vc > 0 && <div style={{ position: 'absolute', bottom: 4, right: 6, fontSize: 8.5, color: '#1F5B54', fontWeight: 700 }}>{vc} คนไข้</div>}
                  </div>
                );
              })}
            </div>

            {selected && (
              <div style={{ background: '#FFFFFF', border: '1px solid #EAE3D3', borderRadius: 12, padding: 16, marginBottom: 22 }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start' }}>
                  <div>
                    <div style={{ fontFamily: "'Kanit', sans-serif", fontSize: 18, fontWeight: 600, color: '#1F5B54' }}>
                      {new Date(selected).toLocaleDateString('th-TH', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })}
                    </div>
                    {selInfo?.holiday && <div style={{ fontSize: 12.5, color: '#9C4530', marginTop: 2 }}>วันหยุด: {selInfo.holiday}</div>}
                  </div>
                  <button onClick={() => { setSelected(null); setHistoryCaseId(null); }} style={{ border: 'none', background: 'none', cursor: 'pointer', padding: 2 }}><Icon name="x" size={18} color="#8A7F63" /></button>
                </div>

                <div style={{ display: 'flex', alignItems: 'center', gap: 8, margin: '10px 0' }}>
                  <span style={{ fontSize: 12, color: '#8A7F63' }}>รหัสเวร:</span>
                  <select value={selShift || ''} onChange={e => setShift(selected, e.target.value || null)}
                    style={{ fontSize: 12.5, fontWeight: 600, border: '1px solid #DCD4C4', borderRadius: 6, padding: '5px 8px', fontFamily: "'Sarabun', sans-serif", background: selShift ? SHIFT_STYLE[selShift]?.soft : '#FAF6EF', color: selShift ? SHIFT_STYLE[selShift]?.text : '#5C6D68' }}>
                    <option value="">— ไม่ระบุ —</option>
                    {Object.keys(SHIFT_STYLE).map(k => <option key={k} value={k}>{k}</option>)}
                  </select>
                  {selShift && <span style={{ fontSize: 11.5, color: '#8A7F63' }}>{shiftNotes[selShift]}</span>}
                </div>

                {selInfo?.shiftNotes?.length > 0 && <div style={{ fontSize: 13, color: '#5C6D68', marginBottom: 10 }}>หมายเหตุเวร: {selInfo.shiftNotes.join(' · ')}</div>}

                <div style={{ fontSize: 11.5, fontWeight: 600, color: '#8A7F63', textTransform: 'uppercase', letterSpacing: 1, marginBottom: 8, marginTop: 4 }}>รายชื่อคนไข้ในวันนี้</div>
                {dayVisits.length > 0 ? (
                  <div style={{ marginBottom: 12 }}>
                    {dayVisits.map(({ case: c, visit: v }) => <VisitRow key={v.id} c={c} v={v} showJump={false} />)}
                  </div>
                ) : (
                  <div style={{ fontSize: 13, color: '#B9AF9A', fontStyle: 'italic', marginBottom: 12 }}>ยังไม่มีคนไข้ในวันนี้</div>
                )}

                <div style={{ border: '1px dashed #DCD4C4', borderRadius: 8, padding: 12 }}>
                  <div style={{ display: 'flex', gap: 6, marginBottom: 10 }}>
                    <button onClick={() => { setAddMode('new'); setPickedCaseId(null); }} style={{ fontSize: 12, fontWeight: 600, padding: '5px 10px', borderRadius: 6, border: 'none', cursor: 'pointer', background: addMode === 'new' ? '#1F5B54' : '#F0EBDD', color: addMode === 'new' ? '#FAF6EF' : '#5C6D68' }}>เคสใหม่</button>
                    <button onClick={() => setAddMode('existing')} style={{ fontSize: 12, fontWeight: 600, padding: '5px 10px', borderRadius: 6, border: 'none', cursor: 'pointer', background: addMode === 'existing' ? '#1F5B54' : '#F0EBDD', color: addMode === 'existing' ? '#FAF6EF' : '#5C6D68' }}>เคสเดิม (นัดต่อเนื่อง)</button>
                  </div>

                  {addMode === 'new' && (
                    <>
                      <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap', marginBottom: 8 }}>
                        <input placeholder="HN" value={fHn} onChange={e => setFHn(e.target.value)} style={{ width: 90, fontSize: 13, border: '1px solid #DCD4C4', borderRadius: 6, padding: '7px 9px', fontFamily: "'IBM Plex Mono', monospace" }} />
                        <input placeholder="ชื่อคนไข้" value={fName} onChange={e => setFName(e.target.value)} style={{ flex: '1 1 140px', fontSize: 13, border: '1px solid #DCD4C4', borderRadius: 6, padding: '7px 9px', fontFamily: "'Sarabun', sans-serif" }} />
                        <input placeholder="เบอร์ติดต่อ" value={fPhone} onChange={e => setFPhone(e.target.value)} style={{ width: 130, fontSize: 13, border: '1px solid #DCD4C4', borderRadius: 6, padding: '7px 9px', fontFamily: "'Sarabun', sans-serif" }} />
                      </div>
                      <div style={{ marginBottom: 8 }}>
                        <select value={fCategory} onChange={e => setFCategory(e.target.value)} style={{ fontSize: 12.5, fontWeight: 600, border: '1px solid #DCD4C4', borderRadius: 6, padding: '6px 8px', fontFamily: "'Sarabun', sans-serif", background: CATEGORY_STYLE[fCategory]?.bg, color: CATEGORY_STYLE[fCategory]?.text }}>
                          {CATEGORIES.map(cat => <option key={cat} value={cat}>{cat}</option>)}
                        </select>
                      </div>
                    </>
                  )}

                  {addMode === 'existing' && !pickedCaseId && (
                    <div style={{ marginBottom: 8, position: 'relative' }}>
                      <div style={{ display: 'flex', alignItems: 'center', gap: 6, border: '1px solid #DCD4C4', borderRadius: 6, padding: '6px 9px' }}>
                        <Icon name="search" size={13} color="#8A7F63" />
                        <input placeholder="ค้นหาด้วย HN หรือชื่อ" value={searchQuery} onChange={e => setSearchQuery(e.target.value)}
                          style={{ border: 'none', outline: 'none', fontSize: 13, flex: 1, fontFamily: "'Sarabun', sans-serif" }} />
                      </div>
                      {searchResults.length > 0 && (
                        <div style={{ border: '1px solid #DCD4C4', borderRadius: 6, marginTop: 4, overflow: 'hidden' }}>
                          {searchResults.map(c => (
                            <div key={c.id} className="search-item" onClick={() => { setPickedCaseId(c.id); setSearchQuery(''); }}
                              style={{ padding: '7px 10px', fontSize: 12.5, cursor: 'pointer', borderBottom: '1px solid #EAE3D3' }}>
                              {c.hn && <span style={{ fontFamily: "'IBM Plex Mono', monospace", color: '#8A7F63', marginRight: 6 }}>HN {c.hn}</span>}
                              <span style={{ fontWeight: 600 }}>{c.name}</span>
                              <span style={{ color: '#8A7F63', marginLeft: 6 }}>({c.category} · {c.visits.length} ครั้ง)</span>
                            </div>
                          ))}
                        </div>
                      )}
                    </div>
                  )}
                  {addMode === 'existing' && pickedCaseId && cases[pickedCaseId] && (
                    <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 8, background: '#F0EBDD', borderRadius: 6, padding: '6px 10px' }}>
                      <span style={{ fontSize: 12.5, fontWeight: 600 }}>{cases[pickedCaseId].hn ? `HN ${cases[pickedCaseId].hn} · ` : ''}{cases[pickedCaseId].name} ({cases[pickedCaseId].category})</span>
                      <button onClick={() => setPickedCaseId(null)} style={{ marginLeft: 'auto', fontSize: 11.5, border: 'none', background: 'none', color: '#1F5B54', cursor: 'pointer', textDecoration: 'underline' }}>เปลี่ยน</button>
                    </div>
                  )}

                  <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 8, flexWrap: 'wrap' }}>
                    <input type="time" value={fTime} onChange={e => setFTime(e.target.value)} style={{ fontSize: 13, border: '1px solid #DCD4C4', borderRadius: 6, padding: '7px 9px', fontFamily: "'IBM Plex Mono', monospace" }} />
                    <span style={{ fontSize: 12, color: '#5C6D68' }}>ระยะเวลา</span>
                    <div style={{ display: 'flex', alignItems: 'center', border: '1px solid #DCD4C4', borderRadius: 6, overflow: 'hidden' }}>
                      <button className="stepbtn" onClick={() => setFDuration(Math.max(15, fDuration - 15))} style={{ border: 'none', background: '#F0EBDD', color: '#1F5B54', width: 28, height: 28, cursor: 'pointer', fontWeight: 700 }}>−</button>
                      <div style={{ width: 56, textAlign: 'center', fontFamily: "'IBM Plex Mono', monospace", fontSize: 13, fontWeight: 600 }}>{fDuration} น.</div>
                      <button className="stepbtn" onClick={() => setFDuration(fDuration + 15)} style={{ border: 'none', background: '#F0EBDD', color: '#1F5B54', width: 28, height: 28, cursor: 'pointer', fontWeight: 700 }}>+</button>
                    </div>
                    <span style={{ fontSize: 11.5, color: '#B9AF9A' }}>ถึง {minToTime(timeToMin(fTime) + fDuration)}</span>
                  </div>
                  <input placeholder={addMode === 'new' ? 'หมายเหตุ / งานที่ทำ (ไม่บังคับ)' : 'ขั้นตอนครั้งนี้ เช่น "Insert RPD ครั้งที่ 2/3"'} value={fStep} onChange={e => setFStep(e.target.value)}
                    style={{ width: '100%', fontSize: 13, border: '1px solid #DCD4C4', borderRadius: 6, padding: '7px 9px', marginBottom: 8, fontFamily: "'Sarabun', sans-serif" }} />

                  {addMode === 'new' ? (
                    <button onClick={createCase} disabled={!fName.trim()} style={{ fontSize: 12.5, fontWeight: 600, background: fName.trim() ? '#1F5B54' : '#DCD4C4', color: '#FAF6EF', border: 'none', borderRadius: 6, padding: '7px 14px', cursor: fName.trim() ? 'pointer' : 'default' }}>+ สร้างเคสใหม่</button>
                  ) : (
                    <button onClick={addVisitToCase} disabled={!pickedCaseId} style={{ fontSize: 12.5, fontWeight: 600, background: pickedCaseId ? '#1F5B54' : '#DCD4C4', color: '#FAF6EF', border: 'none', borderRadius: 6, padding: '7px 14px', cursor: pickedCaseId ? 'pointer' : 'default' }}>+ เพิ่มนัดนี้ในเคส</button>
                  )}
                </div>

                {leftoverNotes.length > 0 && (
                  <details style={{ marginTop: 14 }}>
                    <summary style={{ fontSize: 11.5, fontWeight: 600, color: '#8A7F63', cursor: 'pointer' }}>หมายเหตุอื่นๆจากไฟล์เดิม ({leftoverNotes.length})</summary>
                    <ul style={{ margin: '8px 0 0', paddingLeft: 18, fontSize: 12.5, lineHeight: 1.7, color: '#5C6D68' }}>
                      {leftoverNotes.map((a, i) => <li key={i}>{a}</li>)}
                    </ul>
                  </details>
                )}
              </div>
            )}
          </>
        )}

        {view === 'overview' && (
          <div style={{ marginBottom: 22 }}>
            {THAI_MONTH_NAMES.map((mname, idx) => {
              const m = idx + 1;
              const mc = buildCells(year, m);
              const weeks = [];
              for (let i = 0; i < mc.length; i += 7) weeks.push(mc.slice(i, i + 7));
              return (
                <div key={m} style={{ background: '#FFFFFF', border: '1px solid #EAE3D3', borderRadius: 10, padding: 10, marginBottom: 10 }}>
                  <div style={{ fontFamily: "'Kanit', sans-serif", fontWeight: 600, fontSize: 13.5, color: '#1F5B54', marginBottom: 6 }}>{mname} {year}</div>
                  <div style={{ display: 'grid', gridTemplateColumns: 'repeat(7,1fr)', gap: 3, marginBottom: 3 }}>
                    {WEEKDAYS_TH.map(w => <div key={w} style={{ textAlign: 'center', fontSize: 9, color: '#B9AF9A', fontFamily: "'IBM Plex Mono', monospace" }}>{w}</div>)}
                  </div>
                  {weeks.map((wk, wi) => (
                    <div key={wi} style={{ display: 'grid', gridTemplateColumns: 'repeat(7,1fr)', gap: 3, marginBottom: 3 }}>
                      {wk.map((c, ci) => {
                        if (!c) return <div key={ci} style={{ minHeight: 30 }} />;
                        const s = c.shift ? SHIFT_STYLE[c.shift] : null;
                        return (
                          <div key={c.dstr} className="ov-cell" onClick={() => openDay(c.dstr, year, m)}
                            style={{ minHeight: 30, borderRadius: 4, background: s ? s.soft : '#FAF6EF', cursor: 'pointer', padding: '2px 3px', borderLeft: s ? `2px solid ${s.bar}` : '2px solid transparent' }}>
                            <div style={{ fontSize: 9.5, fontWeight: 600, fontFamily: "'IBM Plex Mono', monospace" }}>{c.day}</div>
                            {s && <div style={{ fontSize: 7.5, color: s.text, fontWeight: 600 }}>{s.label}</div>}
                          </div>
                        );
                      })}
                    </div>
                  ))}
                </div>
              );
            })}
          </div>
        )}

        {view === 'patients' && (
          <div style={{ marginBottom: 22 }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 6, border: '1px solid #DCD4C4', borderRadius: 8, padding: '8px 10px', marginBottom: 12, background: '#FFFFFF' }}>
              <Icon name="search" size={14} color="#8A7F63" />
              <input placeholder="ค้นหาด้วย HN, ชื่อ, หรือประเภทงาน" value={patientListQuery} onChange={e => setPatientListQuery(e.target.value)}
                style={{ border: 'none', outline: 'none', fontSize: 13.5, flex: 1, fontFamily: "'Sarabun', sans-serif" }} />
            </div>
            <div style={{ fontSize: 11.5, color: '#8A7F63', marginBottom: 8 }}>ทั้งหมด {patientListResults.length} เคส</div>
            {patientListResults.map(c => {
              const cs = CATEGORY_STYLE[c.category] || CATEGORY_STYLE['อื่นๆ'];
              return (
                <div key={c.id} className="plist-row" onClick={() => setHistoryCaseId(historyCaseId === c.id ? null : c.id)}
                  style={{ background: '#FFFFFF', border: '1px solid #EAE3D3', borderRadius: 10, padding: '10px 12px', marginBottom: 8, cursor: 'pointer' }}>
                  <div style={{ display: 'flex', alignItems: 'center', gap: 8, flexWrap: 'wrap' }}>
                    {c.hn && <span style={{ fontSize: 11.5, fontFamily: "'IBM Plex Mono', monospace", color: '#8A7F63' }}>HN {c.hn}</span>}
                    <span style={{ fontSize: 14.5, fontWeight: 600, color: '#1F3A35' }}>{c.name}</span>
                    <span style={{ fontSize: 10.5, fontWeight: 700, padding: '1px 8px', borderRadius: 10, background: cs.bg, color: cs.text }}>{c.category}</span>
                    {c.phone && <span style={{ fontSize: 11.5, color: '#B9AF9A' }}>โทร {c.phone}</span>}
                  </div>
                  <div style={{ display: 'flex', gap: 14, marginTop: 6, fontSize: 12, color: '#5C6D68', flexWrap: 'wrap' }}>
                    <span style={{ display: 'flex', alignItems: 'center', gap: 4 }}><Icon name="calendarClock" size={12} /> {c.activeCount} นัด{c.cancelledCount > 0 ? ` (ยกเลิก ${c.cancelledCount})` : ''}</span>
                    {c.nextVisit ? <span>นัดถัดไป: <b>{c.nextVisit.date} {c.nextVisit.time}</b></span> : c.lastVisit ? <span>นัดล่าสุด: {c.lastVisit.date}</span> : null}
                  </div>
                </div>
              );
            })}
            {patientListResults.length === 0 && <div style={{ fontSize: 13, color: '#B9AF9A', fontStyle: 'italic', textAlign: 'center', padding: 20 }}>ไม่พบคนไข้</div>}
          </div>
        )}

        <div style={{ background: '#FFFFFF', border: '1px solid #EAE3D3', borderRadius: 12, padding: 16 }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 10 }}>
            <div style={{ fontFamily: "'Kanit', sans-serif", fontWeight: 600, fontSize: 15, color: '#1F5B54', display: 'flex', alignItems: 'center', gap: 6 }}><Icon name="info" size={16} /> คำอธิบายรหัสเวร</div>
            <button onClick={() => setEditingLegend(!editingLegend)} style={{ display: 'flex', alignItems: 'center', gap: 4, fontSize: 12, border: '1px solid #DCD4C4', background: editingLegend ? '#1F5B54' : '#FAF6EF', color: editingLegend ? '#FAF6EF' : '#5C6D68', borderRadius: 6, padding: '4px 9px', cursor: 'pointer' }}>
              {editingLegend ? <><Icon name="check" size={13} /> เสร็จสิ้น</> : <><Icon name="pencil" size={13} /> แก้ไข</>}
            </button>
          </div>
          {Object.keys(SHIFT_STYLE).map(k => (
            <div key={k} style={{ display: 'flex', gap: 6, marginBottom: 6, alignItems: 'flex-start' }}>
              <span style={{ fontSize: 11, fontWeight: 700, padding: '2px 6px', borderRadius: 4, background: SHIFT_STYLE[k].soft, color: SHIFT_STYLE[k].text, whiteSpace: 'nowrap', flexShrink: 0 }}>{k}</span>
              {editingLegend ? (
                <input value={shiftNotes[k] || ''} onChange={e => setShiftNotes({ ...shiftNotes, [k]: e.target.value })} style={{ fontSize: 12, border: '1px solid #DCD4C4', borderRadius: 4, padding: '2px 6px', flex: 1, fontFamily: "'Sarabun', sans-serif" }} />
              ) : (
                <span style={{ fontSize: 12, color: '#5C6D68' }}>{shiftNotes[k]}</span>
              )}
            </div>
          ))}
          {editingLegend && (
            <button onClick={() => { saveLegend(shiftNotes); setEditingLegend(false); }} style={{ marginTop: 6, fontSize: 12.5, fontWeight: 600, background: '#1F5B54', color: '#FAF6EF', border: 'none', borderRadius: 6, padding: '7px 14px', cursor: 'pointer' }}>บันทึกคำอธิบาย</button>
          )}
        </div>

        <div style={{ textAlign: 'center', fontSize: 10.5, color: '#B9AF9A', marginTop: 16 }}>
          ข้อมูลเวร/นัดของ เม.ย.–ก.ย. 2569 ดึงจากไฟล์ที่อัปโหลด (แปลงเป็นเคสอัตโนมัติ) · กดยกเลิกนัดแทนการลบเพื่อเก็บประวัติไว้ · บันทึกไว้ในเครื่องนี้อัตโนมัติ
        </div>
      </div>
    </div>
  );
}

function App() {
  const [user, setUser] = useState(undefined); // undefined = loading, null = signed out

  useEffect(() => {
    const unsub = auth.onAuthStateChanged(u => {
      currentUid = u ? u.uid : null;
      setUser(u);
    });
    return unsub;
  }, []);

  if (user === undefined) return <LoadingScreen />;
  if (!user) return <SignInScreen />;

  return (
    <div>
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'flex-end', gap: 10, padding: '8px 14px', background: '#F0EBDD', fontFamily: "'Sarabun', sans-serif" }}>
        <span style={{ fontSize: 11.5, color: '#5C6D68' }}>{user.email}</span>
        <button onClick={() => auth.signOut()} style={{ fontSize: 11.5, border: '1px solid #DCD4C4', background: '#FFFFFF', color: '#5C6D68', borderRadius: 6, padding: '4px 10px', cursor: 'pointer' }}>ออกจากระบบ</button>
      </div>
      <ScheduleCalendar key={user.uid} />
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
